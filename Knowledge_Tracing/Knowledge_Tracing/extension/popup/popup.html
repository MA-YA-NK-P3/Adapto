<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Knowledge Tracer</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; width: 320px; margin: 12px; color: #1f2328; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    .muted { color: #656d76; }
    .card { border: 1px solid #d0d7de; border-radius: 6px; padding: 8px; margin: 8px 0; }
    .warn { background: #fff8c5; border-color: #d4a72c; }
    ul { margin: 4px 0; padding-left: 18px; }
    button { margin-right: 6px; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>Knowledge Tracer <span class="muted">prototype</span></h1>
  <div id="status" class="muted">Loading…</div>
  <div id="auth" class="card warn" hidden></div>
  <div id="rec" class="card" hidden></div>
  <div id="err" class="card warn" hidden></div>
  <button id="flush">Send queued events</button>
  <button id="options">Options</button>
  <script src="popup.js"></script>
</body>
</html>
